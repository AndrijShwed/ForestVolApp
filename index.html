<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForestVol</title>
    <link rel="shortcut icon" href="Image/ForestVolume.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="Image/ForestVolume.png" />
    <meta name="theme-color" content="#ffffff" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            overflow-x: auto;
        }

        .container {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: space-between;
            gap: 6px;
        }

        .left {
            flex: 0 0 76%;
        }

        .right {
            flex: 0 0 20%;
            display: flex;
            flex-direction: column;
        }

        .table-wrapper {
            height: 85vh;
            display: flex;
            flex-direction: column;
            border: 1px solid black;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 16px;
        }

        th, td {
            border: 1px solid black;
            padding: 4px 6px;
            text-align: center;
            vertical-align: middle;
        }

        #volumeBodyTable td {
            padding: 2px 4px;
        }

        thead th {
            position: sticky;
            top: 0;
            background-color: #f0f0f0;
            z-index: 2;
        }

        tfoot td {
            position: sticky;
            bottom: 0;
            background-color: aquamarine;
            z-index: 1;
            font-weight: bold;
            font-size: 18px;
        }

        thead th, tfoot td {
            text-align: center;
            vertical-align: middle;
            padding: 6px;
        }

        .scrollable-body {
            overflow-y: auto;
            flex-grow: 1;
            scroll-padding-bottom: 40px;
            padding-bottom: 40px;
        }

        label {
            font-size: 20px;
            margin-top: 12px;
            display: block;
        }

        button {
            font-size: 18px;
            padding: 14px 12px;
            width: 100%;
            margin-top: 12px;
            box-sizing: border-box;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

            button:hover {
                background-color: darkgreen;
            }

        #volumeBodyTable td {
            height: 44px;
            padding: 0;
        }

        .delete-button {
            background-color: #e53935;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
        }

            .delete-button:hover {
                background-color: #c62828;
            }

        .custom-select {
            position: relative;
            font-size: 18px;
            user-select: none;
            width: 100%;
            margin-top: 12px;
        }

        #lang-custom {
            margin-top: 0;
        }

        .select-selected {
            background-color: white;
            border: 1px solid #ccc;
            padding: 14px 12px;
            cursor: pointer;
            position: relative;
        }

            .select-selected:after {
                content: "\25BC";
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                pointer-events: none;
            }

        .select-items {
            position: absolute;
            background-color: white;
            border: 1px solid #ccc;
            border-top: none;
            width: 100%;
            z-index: 99;
            max-height: 57vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

            .select-items div {
                padding: 14px 12px;
                cursor: pointer;
                font-size: 24px;
            }

                .select-items div:hover {
                    background-color: #f1f1f1;
                }

        .select-hide {
            display: none;
        }

        #exportExcelBtn {
            flex-shrink: 0;
            background-color: #007ACC;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 50px;
        }

        #clearStorageBtn {
            flex-shrink: 0;
            background-color: red;
            color: white;
            padding: 4px 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            height: 55px;
            width: 100%;
        }

        .length-3 {
            background-color: plum;
        }

        .length-4 {
            background-color: yellow;
        }

        .length-5 {
            background-color: lightblue;
        }

        .length-6 {
            background-color: lightgreen;
        }

        .row-number {
            font-weight: bold;
            color: #007bff;
            background-color: #e0f0ff;
            padding: 4px 8px;
        }

        .col-10 {
            width: 10%;
        }

        .col-15 {
            width: 15%;
        }

        .col-20 {
            width: 20%;
        }

        .col-25 {
            width: 25%;
        }

        .col-30 {
            width: 30%;
        }

        .down {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
        }

        .spacer {
            flex-grow: 1;
        }

        #lengthSummary {
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .highlighted-row {
            background-color: rgba(255, 100, 100, 0.3);
            transition: background-color 2s ease;
        }

        /* Тост-повідомлення для мобільного експорту */
        #toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 9999;
            display: none;
            max-width: 90%;
            text-align: center;
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .right button {
                padding: 8px 12px;
                margin-top: 6px;
            }

            #clearStorageBtn, #exportExcelBtn {
                height: 40px;
            }
        }
    </style>
</head>

                            showToast._t = setTimeout(() => { toast.style.display = 'none'; }, duration);

                            let isShown = false;

                            function setupCustomSelect(customSelectId, valuesArray, defaultValue, onChange) {
                                const customSelect = document.getElementById(customSelectId);
                                const selected = customSelect.querySelector('.select-selected');
                                const itemsContainer = customSelect.querySelector('.select-items');

                                itemsContainer.innerHTML = '';
                                valuesArray.forEach(val => {
                                    const div = document.createElement('div');
                                    div.textContent = val;
                                    div.dataset.value = val;
                                    itemsContainer.appendChild(div);
                                });

                                selected.textContent = defaultValue;

                                selected.addEventListener('click', () => {
                                    closeAllCustomSelects(customSelect);
                                    itemsContainer.classList.toggle('select-hide');
                                    selected.classList.toggle('active');
                                });

                                    option.addEventListener('click', () => {
                                        selected.textContent = option.textContent;
                                        itemsContainer.classList.add('select-hide');
                                        selected.classList.remove('active');
                                        if (typeof onChange === 'function') onChange(option.dataset.value);
                                    });
                                });
                            }

                            function closeAllCustomSelects(exceptionSelect) {
                                document.querySelectorAll('.custom-select').forEach(cs => {
                                    if (cs !== exceptionSelect) {
                                        cs.querySelector('.select-items')?.classList.add('select-hide');
                                        cs.querySelector('.select-selected')?.classList.remove('active');
                                    }
                                });
                            }

                            document.addEventListener('click', (e) => {
                                if (![...document.querySelectorAll('.custom-select')].some(cs => cs.contains(e.target))) {
                                    closeAllCustomSelects(null);
                                }
                            });

                            function translateStaticUI() {
                                document.getElementById('th-num').textContent = t('th_num');
                                document.getElementById('th-length').textContent = t('th_length');
                                document.getElementById('th-diameter-unit').textContent = t('th_diameter_unit');
                                document.getElementById('th-volume').textContent = t('th_volume');
                                document.getElementById('lbl-v').textContent = t('lbl_v');
                                document.getElementById('lbl-count').textContent = t('lbl_count');
                                document.querySelectorAll('.lbl-sht').forEach(el => el.textContent = t('lbl_sht'));
                                document.getElementById('lbl-length').textContent = t('lbl_length');
                                document.getElementById('lbl-diameter').textContent = t('lbl_diameter');
                                const langLbl = document.getElementById('lbl-lang');
                                if (langLbl) langLbl.textContent = t('lbl_lang');
                                document.getElementById('btn-add').textContent = t('btn_add');
                                document.getElementById('clearStorageBtn').textContent = t('btn_clear');
                                document.getElementById('exportExcelBtn').textContent = t('btn_export');
                                document.getElementById('toggleLengthBtn').textContent = isShown ? t('btn_toggle_hide') : t('btn_toggle_show');
                                document.querySelectorAll('.delete-button').forEach(btn => btn.title = t('delete_title'));
                                document.documentElement.lang = currentLang;
                                const langSelected = document.querySelector('#lang-custom .select-selected');
                                if (langSelected) langSelected.textContent = t('lang_short');
                            }

                            function setLanguage(lang) {
                                currentLang = lang;
                                localStorage.setItem('forestvol_lang', lang);
                                translateStaticUI();
                            }

                            function setupLangSelect() {
                                const customSelect = document.getElementById('lang-custom');
                                const selected = customSelect.querySelector('.select-selected');
                                const itemsContainer = customSelect.querySelector('.select-items');

                                selected.addEventListener('click', () => {
                                    closeAllCustomSelects(customSelect);
                                    itemsContainer.classList.toggle('select-hide');
                                    selected.classList.toggle('active');
                                });

                                itemsContainer.querySelectorAll('div').forEach(option => {
                                    option.addEventListener('click', () => {
                                        itemsContainer.classList.add('select-hide');
                                        selected.classList.remove('active');
                                        setLanguage(option.dataset.value);
                                        document.getElementById("tikSound").play();
                                    });
                                });
                            }

                            setupLangSelect();

                            const diameters = [];
                            for (let d = 16; d <= 60; d++) diameters.push(d.toString());

                            let selectedLength = "6";
                            let selectedDiameter = "16";
                            let count = 0;

                            setupCustomSelect('length-custom', ["2", "3", "4", "5", "6"], selectedLength, (val) => {
                                selectedLength = val;
                                document.getElementById("tikSound").play();
                            });

                            setupCustomSelect('diameter-custom', diameters, selectedDiameter, (val) => {
                                selectedDiameter = val;
                                document.getElementById("tikSound").play();
                            });

                            let highlightTimeout;

                            window.saveEntry = function () {
                                count++;
                                const key = `${selectedLength}-${selectedDiameter}`;
                                const volume = volumeLookup[key];
                                if (volume !== undefined) {
                                    const tableBody = document.querySelector("#volumeBodyTable tbody");

                                    const lastHighlighted = tableBody.querySelector(".highlighted-row");
                                    if (lastHighlighted) lastHighlighted.classList.remove("highlighted-row");
                                    clearTimeout(highlightTimeout);

                                    const newRow = tableBody.insertRow();
                                    newRow.innerHTML = `
                                                                <td class="row-number col-10">${count}</td>
                                                                <td class="col-20">${selectedLength}</td>
                                                                <td class="col-25">${selectedDiameter}</td>
                                                                <td class="col-30">${volume.toFixed(3)}</td>
                                                                <td class="col-15">
                                                                   <button class="delete-button" onclick="deleteEntry(this, ${volume}, ${selectedLength})" title="${t('delete_title')}">🗑</button>
                                                                </td>`;

                                    newRow.classList.add("highlighted-row");
                                    highlightTimeout = setTimeout(() => {
                                        newRow.classList.remove("highlighted-row");
                                    }, 5000);

                                    if (selectedLength == 2) newRow.classList.add("length-2");
                                    else if (selectedLength == 3) newRow.classList.add("length-3");
                                    else if (selectedLength == 4) newRow.classList.add("length-4");
                                    else if (selectedLength == 5) newRow.classList.add("length-5");
                                    else if (selectedLength == 6) newRow.classList.add("length-6");

                                    updateRowNumbers();

                                    const totalField = document.getElementById("totalVolume");
                                    const currentTotal = parseFloat(totalField.textContent);
                                    totalField.textContent = (currentTotal + volume).toFixed(3);

                                    document.getElementById("totalCount").textContent = tableBody.rows.length;

                                    countsByLength[parseInt(selectedLength)] += 1;
                                    volumesByLength[parseInt(selectedLength)] += volume;

                                    saveToLocalStorage();
                                    updateLengthTotals();

                                    document.querySelector('.scrollable-body').scrollTop =
                                        document.querySelector('.scrollable-body').scrollHeight;

                                    document.getElementById("clickSound").play();
                                } else {
                                    alert(t('alert_not_found'));
                                }
                            };

                            window.deleteEntry = function (button, volume, length) {
                                const row = button.closest('tr');
                                row.remove();
                                countsByLength[length] -= 1;
                                volumesByLength[length] -= volume;

                                saveToLocalStorage();
                                updateRowNumbers();
                                updateLengthTotals();

                                const totalField = document.getElementById("totalVolume");
                                const currentTotal = parseFloat(totalField.textContent);
                                totalField.textContent = (currentTotal - volume).toFixed(3);

                                const tableBody = document.querySelector("#volumeBodyTable tbody");
                                document.getElementById("totalCount").textContent = tableBody.rows.length;

                                document.getElementById("deleteSound").play();
                            };

                            function updateRowNumbers() {
                                const tableBody = document.querySelector("#volumeBodyTable tbody");
                                const rows = tableBody.rows;
                                for (let i = 0; i < rows.length; i++) {
                                    rows[i].cells[0].textContent = i + 1;
                                }
                            }

                            function saveToLocalStorage() {
                                const tableBody = document.querySelector("#volumeBodyTable tbody");
                                const data = [];

                                for (let row of tableBody.rows) {
                                    const rowData = {
                                        length: row.cells[1].textContent.trim(),
                                        diameter: row.cells[2].textContent.trim(),
                                        volume: row.cells[3].textContent.trim()
                                    };
                                    data.push(rowData);
                                }

                                const totalVolume = document.getElementById("totalVolume").textContent;
                                const totalCount = document.getElementById("totalCount").textContent;

                                localStorage.setItem("forestvol_table", JSON.stringify(data));
                                localStorage.setItem("forestvol_totalVolume", totalVolume);
                                localStorage.setItem("forestvol_totalCount", totalCount);
                                localStorage.setItem("forestvol_countsByLength", JSON.stringify(countsByLength));
                                localStorage.setItem("forestvol_volumesByLength", JSON.stringify(volumesByLength));
                            }

                            function loadFromLocalStorage() {
                                const data = JSON.parse(localStorage.getItem("forestvol_table") || "[]");
                                const tableBody = document.querySelector("#volumeBodyTable tbody");
                                tableBody.innerHTML = "";
                                count = 0;
                                let totalVolume = 0;

                                data.forEach(entry => {
                                    const volume = parseFloat(entry.volume);
                                    if (isNaN(volume)) return;

                                    count++;
                                    const newRow = tableBody.insertRow();
                                    newRow.innerHTML = `
                                                <td class="row-number col-10">${count}</td>
                                                <td class="col-20">${entry.length}</td>
                                                <td class="col-25">${entry.diameter}</td>
                                                <td class="col-30">${volume.toFixed(3)}</td>
                                                <td class="col-15">
                                                    <button class="delete-button" onclick="deleteEntry(this, ${volume}, ${entry.length})" title="${t('delete_title')}">🗑</button>
                                                </td>`;

                                    newRow.classList.add(`length-${entry.length}`);
                                    totalVolume += volume;
                                });

                                document.getElementById("totalVolume").textContent = totalVolume.toFixed(3);
                                document.getElementById("totalCount").textContent = count.toString();

                                const storedCounts = JSON.parse(localStorage.getItem("forestvol_countsByLength") || "{}");
                                const storedVolumes = JSON.parse(localStorage.getItem("forestvol_volumesByLength") || "{}");

                                for (let len of [2, 3, 4, 5, 6]) {
                                    countsByLength[len] = storedCounts[len] || 0;
                                    volumesByLength[len] = storedVolumes[len] || 0;
                                }

                                updateLengthTotals();
                                updateRowNumbers();
                            }

                            function buildWorkbook() {
                                const table = document.getElementById('volumeBodyTable');
                                const wb = XLSX.utils.book_new();
                                let i = 1;

                                const ws_data = [['№ п/п', 'L, m', 'Ø', 'V, куб']];
                                for (let row of table.tBodies[0].rows) {
                                    ws_data.push([
                                        i,
                                        row.cells[1].textContent.trim(),
                                        row.cells[2].textContent.trim(),
                                        row.cells[3].textContent.trim()
                                    ]);
                                    i++;
                                }

                                const totalVolume = document.getElementById('totalVolume').textContent.trim();
                                const totalCount = document.getElementById('totalCount').textContent.trim();
                                const volume_6 = document.getElementById("volume_6").textContent.trim();
                                const count_6 = document.getElementById("count_6").textContent.trim();
                                const volume_5 = document.getElementById("volume_5").textContent.trim();
                                const count_5 = document.getElementById("count_5").textContent.trim();
                                const volume_4 = document.getElementById("volume_4").textContent.trim();
                                const count_4 = document.getElementById("count_4").textContent.trim();
                                const volume_3 = document.getElementById("volume_3").textContent.trim();
                                const count_3 = document.getElementById("count_3").textContent.trim();
                                const volume_2 = document.getElementById("volume_2").textContent.trim();
                                const count_2 = document.getElementById("count_2").textContent.trim();

                                ws_data.push([]);
                                ws_data.push(['6м:', '', count_6, volume_6]);
                                ws_data.push(['5м:', '', count_5, volume_5]);
                                ws_data.push(['4м:', '', count_4, volume_4]);
                                ws_data.push(['3м:', '', count_3, volume_3]);
                                ws_data.push(['2м:', '', count_2, volume_2]);
                                ws_data.push([t('xls_total'), '', '', '']);
                                ws_data.push([t('xls_sum_volume'), '', '', totalVolume]);
                                ws_data.push([t('xls_count'), '', '', totalCount]);

                                const ws = XLSX.utils.aoa_to_sheet(ws_data);

                                const commonStyle = {
                                    font: { sz: 14 },
                                    alignment: { horizontal: "center", vertical: "center" },
                                    border: {
                                        top: { style: "thin", color: { rgb: "000000" } },
                                        right: { style: "thin", color: { rgb: "000000" } },
                                        bottom: { style: "thin", color: { rgb: "000000" } },
                                        left: { style: "thin", color: { rgb: "000000" } }
                                    }
                                };

                                const boldCenterStyle = {
                                    font: { sz: 14, bold: true },
                                    alignment: commonStyle.alignment,
                                    border: commonStyle.border
                                };

                                for (let cellAddress in ws) {
                                    if (cellAddress[0] === '!') continue;
                                    ws[cellAddress].s = { ...commonStyle };
                                }

                                ws['!cols'] = [{ wch: 10 }, { wch: 18 }, { wch: 18 }, { wch: 15 }];

                                const summaryStartRow = ws_data.length - 3;
                                ws['!merges'] = [
                                    { s: { r: summaryStartRow, c: 0 }, e: { r: summaryStartRow, c: 3 } },
                                    { s: { r: summaryStartRow + 1, c: 0 }, e: { r: summaryStartRow + 1, c: 2 } },
                                    { s: { r: summaryStartRow + 2, c: 0 }, e: { r: summaryStartRow + 2, c: 2 } },
                                    { s: { r: summaryStartRow - 1, c: 0 }, e: { r: summaryStartRow - 1, c: 1 } },
                                    { s: { r: summaryStartRow - 2, c: 0 }, e: { r: summaryStartRow - 2, c: 1 } },
                                    { s: { r: summaryStartRow - 3, c: 0 }, e: { r: summaryStartRow - 3, c: 1 } },
                                    { s: { r: summaryStartRow - 4, c: 0 }, e: { r: summaryStartRow - 4, c: 1 } },
                                    { s: { r: summaryStartRow - 5, c: 0 }, e: { r: summaryStartRow - 5, c: 1 } }

                                ];

                                const boldCells = [
                                    'A1', 'B1', 'C1', 'D1',
                                    'A' + (summaryStartRow + 1),
                                    'A' + (summaryStartRow + 2), 'D' + (summaryStartRow + 2),
                                    'A' + (summaryStartRow + 3), 'D' + (summaryStartRow + 3)
                                ];

                                ['A' + (summaryStartRow - 5), 'A' + (summaryStartRow - 4), 'A' + (summaryStartRow - 3), 'A' + (summaryStartRow - 2), 'A' + (summaryStartRow - 1), 'A' + (summaryStartRow),
                                'B' + (summaryStartRow - 5), 'B' + (summaryStartRow - 4), 'B' + (summaryStartRow - 3), 'B' + (summaryStartRow - 2), 'B' + (summaryStartRow - 1), 'B' + (summaryStartRow),
                                'C' + (summaryStartRow - 5), 'C' + (summaryStartRow - 4), 'C' + (summaryStartRow - 3), 'C' + (summaryStartRow - 2), 'C' + (summaryStartRow - 1), 'C' + (summaryStartRow),
                                'D' + (summaryStartRow - 5), 'D' + (summaryStartRow - 4), 'D' + (summaryStartRow - 3), 'D' + (summaryStartRow - 2), 'D' + (summaryStartRow - 1), 'D' + (summaryStartRow)]
                                    .forEach(cell => { if (ws[cell]) ws[cell].s = { ...boldCenterStyle }; });

                                boldCells.forEach(cell => { if (ws[cell]) ws[cell].s = { ...boldCenterStyle }; });

                                XLSX.utils.book_append_sheet(wb, ws, "Таблиця");
                                return wb;
                            }

                            async function exportTableToExcel() {
                                document.getElementById("tapSound").play();
                                const wb = buildWorkbook();
                                const fileName = "forestvol_table.xlsx";

                                if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
                                    try {
                                        const plugins = (window.Capacitor && window.Capacitor.Plugins) || {};
                                        const Filesystem = plugins.Filesystem;
                                        const Share = plugins.Share;

                                        if (!Filesystem || !Share) {
                                            showToast(t('toast_no_plugins'));
                                            return;
                                        }

                                        const Directory = { Cache: 'CACHE' };

                                        const base64 = XLSX.write(wb, { type: 'base64', bookType: 'xlsx' });

                                        const result = await Filesystem.writeFile({
                                            path: fileName,
                                            data: base64,
                                            directory: Directory.Cache
                                        });

                                        await Share.share({
                                            title: t('share_title'),
                                            text: t('share_text'),
                                            url: result.uri,
                                            dialogTitle: t('share_dialog_title')
                                        });

                                       
                                    } catch (err) {
                                        console.error(err);
                                        showToast(t('toast_save_error') + err.message);
                                    }
                                } else {
                                    XLSX.writeFile(wb, fileName);
                                }
                            }

                            document.getElementById('exportExcelBtn').addEventListener('click', exportTableToExcel);

                            document.getElementById("clearStorageBtn").addEventListener("click", function () {
                                if (confirm(t('confirm_clear'))) {
                                    localStorage.removeItem("forestvol_table");
                                    localStorage.removeItem("forestvol_totalVolume");
                                    localStorage.removeItem("forestvol_totalCount");
                                    localStorage.removeItem("forestvol_countsByLength");
                                    localStorage.removeItem("forestvol_volumesByLength");

                                    const tableBody = document.querySelector("#volumeBodyTable tbody");
                                    tableBody.innerHTML = "";

                                    for (let len of [2, 3, 4, 5, 6]) {
                                        countsByLength[len] = 0;
                                        volumesByLength[len] = 0;
                                    }

                                    document.getElementById("totalVolume").textContent = "0.000";
                                    document.getElementById("totalCount").textContent = "0";

                                    updateLengthTotals();
                                    document.getElementById("BacketSound").play();
                                }
                            });

                            translateStaticUI();
                            loadFromLocalStorage();

                            function updateLengthTotals() {
                                for (let len of [2, 3, 4, 5, 6]) {
                                    const countSpan = document.getElementById(`count_${len}`);
                                    const volumeSpan = document.getElementById(`volume_${len}`);
                                    if (countSpan) countSpan.textContent = countsByLength[len];
                                    if (volumeSpan) volumeSpan.textContent = volumesByLength[len].toFixed(3);
                                }
                            }

                            window.toggleLengthSummary = function () {
                                const rows = ['row_6', 'row_5', 'row_4', 'row_3', 'row_2'];
                                rows.forEach(id => {
                                    const row = document.getElementById(id);
                                    row.style.display = isShown ? 'none' : '';
                                });
                                const btn = document.getElementById('toggleLengthBtn');
                                isShown = !isShown;
                                btn.textContent = isShown ? t('btn_toggle_hide') : t('btn_toggle_show');
                            };
                        });
    </script>
